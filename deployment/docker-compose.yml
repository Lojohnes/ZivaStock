version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: zivastock_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-zivastockdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-zivastockdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zivastock_network

  redis:
    image: redis:7-alpine
    container_name: zivastock_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zivastock_network

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: zivastock_backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ../uploads:/app/uploads
      - ../logs:/app/logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zivastock_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    container_name: zivastock_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - zivastock_network

volumes:
  postgres_data:
  redis_data:

networks:
  zivastock_network:
    driver: bridge
