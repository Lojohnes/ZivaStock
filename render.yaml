services:
  - type: web
    name: zivastock-api
    runtime: docker
    dockerfilePath: ./deployment/Dockerfile.backend
    dockerContext: .
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zivastock-db
          property: connectionString
      - key: APP_NAME
        value: ZivaStock
      - key: APP_VERSION
        value: 1.0.0
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://ziva-stock-ov8p971h2-lojohnes-projects.vercel.app
      - key: UPLOAD_DIR
        value: /tmp/uploads

databases:
  - name: zivastock-db
    plan: free
    databaseName: zivastockdb
    user: zivastock
